<!-- File: src/assets/images/posts/fallback/foseer-default-cover.svg -->
<!-- Purpose: Fallback cover image for articles without a cover image. -->

<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d5a87;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:0.5" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bgGradient)" />
  
  <!-- Abstract news pattern -->
  <g opacity="0.4">
    <!-- Horizontal lines suggesting news columns -->
    <line x1="100" y1="200" x2="700" y2="200" stroke="#ffffff" stroke-width="3" opacity="0.3" />
    <line x1="100" y1="240" x2="600" y2="240" stroke="#ffffff" stroke-width="3" opacity="0.2" />
    <line x1="100" y1="280" x2="650" y2="280" stroke="#ffffff" stroke-width="3" opacity="0.25" />
    <line x1="100" y1="320" x2="550" y2="320" stroke="#ffffff" stroke-width="3" opacity="0.2" />
    
    <!-- Abstract shape suggesting media/image -->
    <rect x="800" y="200" width="500" height="280" fill="url(#accentGradient)" rx="8" />
    <circle cx="1050" cy="340" r="60" fill="#ffffff" opacity="0.15" />
    
    <!-- More lines -->
    <line x1="100" y1="520" x2="750" y2="520" stroke="#ffffff" stroke-width="3" opacity="0.25" />
    <line x1="100" y1="560" x2="680" y2="560" stroke="#ffffff" stroke-width="3" opacity="0.2" />
    <line x1="100" y1="600" x2="720" y2="600" stroke="#ffffff" stroke-width="3" opacity="0.22" />
  </g>
  
  <!-- Foseer branding mark (subtle) -->
  <g transform="translate(1350, 750)" opacity="0.5">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#ffffff" letter-spacing="2">
      FOSEER
    </text>
    <text x="0" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#ffffff" opacity="0.7" letter-spacing="1">
      NEWS &amp; ANALYSIS
    </text>
  </g>
</svg>
