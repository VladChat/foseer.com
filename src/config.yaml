site:
  name: Foseer
  site: 'https://foseer.com'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: '' # TODO: add your own Google verification ID when you verify the domain

# Default SEO metadata
metadata:
  title:
    default: Foseer
    template: '%s — Foseer'
  description: "Foseer is a news and insights site highlighting what matters now in business, technology, politics, society, and culture."
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Foseer
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    handle: '' # TODO: set your X/Twitter handle, e.g. '@foseer'
    site: ''   # TODO: usually same as handle
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
