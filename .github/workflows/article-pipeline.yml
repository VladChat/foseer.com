name: Article Pipeline

on:
  workflow_dispatch:
    inputs:
      max_articles_per_run:
        description: 'How many articles to attempt in one run (1-5)'
        required: false
        default: '1'
        type: string
  schedule:
    - cron: '27 6 * * *'
      timezone: 'America/Chicago'

permissions:
  actions: write
  contents: write

concurrency:
  group: article-pipeline
  cancel-in-progress: false

jobs:
  run-article-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PIPELINE_RUNTIME_ROOT: /tmp/foseer-runtime/${{ github.run_id }}
      QWEN_MAX_ARTICLES_PER_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.max_articles_per_run || '1' }}
      QWEN_MIN_ARTICLES_TARGET: '2'
      QWEN_SELECTION_COVERAGE_FLOOR_ENABLED: 'true'
      QWEN_SELECTION_COVERAGE_FLOOR_MIN_ARTICLES: '3'
      QWEN_RSS_ADAPTIVE_SHARE: 'true'
      QWEN_RSS_ADAPTIVE_MAX_SHARE: '0.45'
      QWEN_RSS_ADAPTIVE_UNDERCOVERAGE_RATIO: '0.34'
      QWEN_RSS_ADAPTIVE_LOW_SUPPLY_THRESHOLD: '10'
      QWEN_RECENT_DUPLICATE_WINDOW_DAYS: '3'
      QWEN_DUPLICATE_SCORE_THRESHOLD: '85'
      QWEN_DUPLICATE_UNDERREP_TOPIC_BONUS: '4'
      QWEN_SEARCH_NETWORK_MODE: cache_refresh_with_live_quota
      QWEN_BRAVE_MAX_LIVE_QUERIES: '15'
      QWEN_GOOGLE_MAX_LIVE_QUERIES: '30'
      QWEN_GDELT_MAX_LIVE_QUERIES: '6'
      QWEN_BRAVE_RESCUE_MAX_LIVE_QUERIES: '2'
      QWEN_GOOGLE_RESCUE_MAX_LIVE_QUERIES: '4'
      QWEN_GDELT_RESCUE_MAX_LIVE_QUERIES: '2'
      QWEN_GDELT_RATE_LIMIT_LOCK_MS: '1800000'
      QWEN_ENABLE_SINGLE_SOURCE_WHITELIST: 'true'
      QWEN_SINGLE_SOURCE_WHITELIST_MIN_COHERENCE: '0.58'
      QWEN_SINGLE_SOURCE_WHITELIST_MIN_CONSISTENCY: '4.8'
      SELECTION_LEASE_MINUTES: '35'
      QWEN_MIN_SEARCH_INTERVAL_MS: '10000'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute cache bucket (8h)
        id: cache_bucket
        run: echo "bucket=$(( $(date +%s) / 28800 ))" >> "$GITHUB_OUTPUT"

      - name: Restore runtime search cache
        id: restore_runtime_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            qwen-cache
            qwen-data/events/discovered-news-pool.json
            qwen-data/events/discovery-lane-state.json
            qwen-data/events/news-pool.json
            qwen-data/events/ready-article-candidates.json
            qwen-data/events/provider-circuit-state.json
            qwen-data/images/image-registry.json
            qwen-data/writer-rotation-state.json
          key: foseer-runtime-search-cache-${{ runner.os }}-${{ steps.cache_bucket.outputs.bucket }}-${{ github.run_id }}
          restore-keys: |
            foseer-runtime-search-cache-${{ runner.os }}-${{ steps.cache_bucket.outputs.bucket }}-
            foseer-runtime-search-cache-${{ runner.os }}-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run canonical article pipeline
        id: article_pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_WRITER_MODEL: gpt-5.1
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY || secrets.UNSPLASH_API_KEY }}
          UNSPLASH_API_KEY: ${{ secrets.UNSPLASH_API_KEY || secrets.UNSPLASH_ACCESS_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          SEARCH_WEB_API: ${{ secrets.SEARCH_WEB_API }}
          SEARCH_WEB_CX: ${{ secrets.SEARCH_WEB_CX }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          QWEN_API_RETRY_MAX_ATTEMPTS: '3'
          QWEN_API_RETRY_BASE_DELAY_MS: '700'
          QWEN_API_RETRY_MAX_DELAY_MS: '6000'
        run: |
          set +e
          npm run article:auto
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

          if [ "$exit_code" -eq 0 ]; then
            echo "result=success" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          result_file="qwen-data/events/pipeline-last-result.json"
          if [ -f "$result_file" ]; then
            if node -e "const fs=require('node:fs');const p='qwen-data/events/pipeline-last-result.json';const data=JSON.parse(fs.readFileSync(p,'utf8'));const blocker=String(data?.hard_blocker||'').toLowerCase();const published=Number(data?.stats?.articles_published||0);const controlled=published===0 && /(no publishable candidate|source pack gate failed|no candidates discovered|no briefs normalized|pre-draft quality gate failed|duplicate guard|direct-event sources|pre-draft duplicate|pre-draft direct-event source|source_overlap>=2)/.test(blocker);process.exit(controlled?0:1);"; then
              echo "result=no_article" >> "$GITHUB_OUTPUT"
              echo "No publishable article this run. Skipping build/commit/push."
              exit 0
            fi
          fi

          echo "result=failure" >> "$GITHUB_OUTPUT"
          exit "$exit_code"

      - name: Prune runtime-only artifacts
        if: ${{ always() }}
        run: npm run qwen:prune-runtime

      - name: Validate site build before persistence
        if: ${{ success() && steps.article_pipeline.outputs.result == 'success' }}
        run: npm run build

      - name: Commit generated article artifacts
        id: commit_changes
        if: ${{ success() && steps.article_pipeline.outputs.result == 'success' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A src/data/post src/assets/images/posts src/assets/images/library qwen-data/publish-manifests

          npm run qwen:guard-runtime-artifacts

          if git diff --cached --quiet; then
            echo "No generated article changes to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore(content): auto-generate article"
          git push
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger deploy workflow for new content commit
        if: ${{ success() && steps.article_pipeline.outputs.result == 'success' && steps.commit_changes.outputs.committed == 'true' }}
        run: |
          curl --fail --show-error --silent \
            -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches \
            -d '{"ref":"main"}'

      - name: Save runtime search cache
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: |
            qwen-cache
            qwen-data/events/discovered-news-pool.json
            qwen-data/events/discovery-lane-state.json
            qwen-data/events/news-pool.json
            qwen-data/events/ready-article-candidates.json
            qwen-data/events/provider-circuit-state.json
            qwen-data/images/image-registry.json
            qwen-data/writer-rotation-state.json
          key: foseer-runtime-search-cache-${{ runner.os }}-${{ steps.cache_bucket.outputs.bucket }}-${{ github.run_id }}
