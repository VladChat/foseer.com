name: Auto Article

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-article
  cancel-in-progress: false

jobs:
  auto-article:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PIPELINE_RUNTIME_ROOT: /tmp/foseer-runtime/${{ github.run_id }}
      QWEN_MAX_ARTICLES_PER_RUN: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run canonical auto-article launcher
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          SEARCH_WEB_API: ${{ secrets.SEARCH_WEB_API }}
          SEARCH_WEB_CX: ${{ secrets.SEARCH_WEB_CX }}
          QWEN_API_RETRY_MAX_ATTEMPTS: '3'
          QWEN_API_RETRY_BASE_DELAY_MS: '700'
          QWEN_API_RETRY_MAX_DELAY_MS: '6000'
        run: npm run article:auto

      - name: Build sanity check
        run: npm run build

      - name: Commit generated article artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A src/data/post src/assets/images/posts src/assets/images/library qwen-data/images qwen-data/publish-manifests qwen-data/events qwen-data/quality-audits qwen-data/writer-rotation-state.json

          if git diff --cached --quiet; then
            echo "No generated article changes to commit."
            exit 0
          fi

          git commit -m "chore(content): auto-generate article"
          git push
