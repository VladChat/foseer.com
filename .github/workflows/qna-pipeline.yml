name: QnA Pipeline

on:
  workflow_dispatch:
  
  schedule:
  - cron: '17 11 * * *'
    timezone: 'America/Chicago'
    
permissions:
  actions: write
  contents: write

concurrency:
  group: qna-pipeline
  cancel-in-progress: false

jobs:
  run-qna-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PIPELINE_RUNTIME_ROOT: /tmp/foseer-runtime/${{ github.run_id }}
      QWEN_SEARCH_NETWORK_MODE: cache_refresh_with_live_quota
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run question-led article pipeline
        id: qna_pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_WRITER_MODEL: gpt-5.1
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          SEARCH_WEB_API: ${{ secrets.SEARCH_WEB_API }}
          SEARCH_WEB_CX: ${{ secrets.SEARCH_WEB_CX }}
          QWEN_API_RETRY_MAX_ATTEMPTS: '3'
          QWEN_API_RETRY_BASE_DELAY_MS: '700'
          QWEN_API_RETRY_MAX_DELAY_MS: '6000'
        run: |
          set +e
          npm run article:qna
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

          if [ "$exit_code" -eq 0 ]; then
            echo "result=success" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          result_file="qwen-data/events/qna-pipeline-last-result.json"
          if [ -f "$result_file" ]; then
            if node -e "const fs=require('node:fs');const p='qwen-data/events/qna-pipeline-last-result.json';const data=JSON.parse(fs.readFileSync(p,'utf8'));const blocker=String(data?.hard_blocker||'').toLowerCase();const controlled=/(no brief candidates available|no brief candidate passed source-pack viability gate|no viable question candidates after quality filtering|no question candidate passed source-pack assembly|source-pack gate failed)/.test(blocker);process.exit(controlled?0:1);"; then
              echo "result=no_article" >> "$GITHUB_OUTPUT"
              echo "No publishable QnA article this run. Skipping build/commit/push."
              exit 0
            fi
          fi

          echo "result=failure" >> "$GITHUB_OUTPUT"
          exit "$exit_code"

      - name: Validate site build before persistence
        if: ${{ success() && steps.qna_pipeline.outputs.result == 'success' }}
        run: npm run build

      - name: Commit generated article artifacts
        id: commit_changes
        if: ${{ success() && steps.qna_pipeline.outputs.result == 'success' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A src/data/post src/assets/images/posts src/assets/images/library qwen-data/images qwen-data/publish-manifests qwen-data/events qwen-data/questions qwen-data/quality-audits qwen-data/writer-rotation-state.json

          if git diff --cached --quiet; then
            echo "No generated article changes to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore(content): auto-generate qna article"
          git push
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger deploy workflow for new content commit
        if: ${{ success() && steps.qna_pipeline.outputs.result == 'success' && steps.commit_changes.outputs.committed == 'true' }}
        run: |
          curl --fail --show-error --silent \
            -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches \
            -d '{"ref":"main"}'
